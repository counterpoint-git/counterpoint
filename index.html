<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counterpoint // Tech Verdicts</title>
  <style>
    :root {
      --bg: #090d16;
      --card: rgba(22, 31, 48, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --green: #4ade80;
      --red: #f87171;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
      max-width: 1000px;
      margin: auto;
      line-height: 1.5;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }
    .status { font-size: 13px; color: var(--muted); background: #1e293b; padding: 6px 12px; border-radius: 20px; }

    .hero-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 28px;
    }
    .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
    .hero-title { font-size: 24px; font-weight: 800; }
    .score-box { background: #0f172a; border: 1px solid var(--accent); padding: 10px 18px; border-radius: 10px; text-align: center; }
    .score-num { font-size: 28px; font-weight: 900; color: var(--accent); }
    .score-label { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .summary-text { color: #cbd5e1; margin-bottom: 20px; font-size: 15px; }

    .bench-row { display: flex; align-items: center; gap: 12px; font-size: 13px; margin-bottom: 10px; }
    .bench-name { width: 140px; color: var(--muted); }
    .bench-bar-bg { flex: 1; height: 8px; background: #0f172a; border-radius: 6px; overflow: hidden; }
    .bench-bar-fill { height: 100%; background: var(--accent); border-radius: 6px; }
    .bench-val { width: 40px; text-align: right; font-weight: 700; }

    .pros-cons { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 20px; }
    .box { background: #0f172a; padding: 14px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; }
    .box h4 { margin-bottom: 8px; font-size: 13px; text-transform: uppercase; }
    .pros h4 { color: var(--green); }
    .cons h4 { color: var(--red); }
    .box ul { list-style: none; color: #cbd5e1; }
    .box li { margin-bottom: 6px; }

    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; }
    .news-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
    .news-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .news-cat { font-size: 11px; color: var(--accent); text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
    .news-card h3 { font-size: 15px; margin-bottom: 10px; }
    .news-take { font-size: 13px; color: var(--muted); background: #0f172a; padding: 10px; border-radius: 6px; border-left: 3px solid var(--accent); }
  </style>
</head>
<body>

  <header>
    <div class="logo">COUNTER<span>POINT</span></div>
    <div class="status" id="last-updated">Checking data...</div>
  </header>

  <section class="hero-card">
    <div class="hero-top">
      <h1 class="hero-title" id="prod-name">Loading review...</h1>
      <div class="score-box">
        <div class="score-num" id="prod-score">--</div>
        <div class="score-label">Verdict</div>
      </div>
    </div>
    <p class="summary-text" id="prod-summary">Connecting to data...</p>

    <div id="benchmarks-list"></div>

    <div class="pros-cons">
      <div class="box pros">
        <h4>+ Reviewer Praises</h4>
        <ul id="pros-list"></ul>
      </div>
      <div class="box cons">
        <h4>- Flaws & Dealbreakers</h4>
        <ul id="cons-list"></ul>
      </div>
    </div>
  </section>

  <h2 class="section-title">Latest Hardware Radar</h2>
  <section class="news-grid" id="news-grid"></section>

  <script>
    fetch('./data.json?t=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        document.getElementById('last-updated').innerText = data.last_updated;

        const rev = data.featured_review;
        document.getElementById('prod-name').innerText = rev.product_name;
        document.getElementById('prod-score').innerText = rev.consensus_score + "/10";
        document.getElementById('prod-summary').innerText = rev.verdict_summary;

        document.getElementById('benchmarks-list').innerHTML = rev.benchmarks.map(b => `
          <div class="bench-row">
            <div class="bench-name">${b.metric}</div>
            <div class="bench-bar-bg"><div class="bench-bar-fill" style="width: ${b.score}%"></div></div>
            <div class="bench-val">${b.score}%</div>
          </div>
        `).join('');

        document.getElementById('pros-list').innerHTML = rev.pros.map(p => `<li>• ${p}</li>`).join('');
        document.getElementById('cons-list').innerHTML = rev.cons.map(c => `<li>• ${c}</li>`).join('');

        document.getElementById('news-grid').innerHTML = data.live_news.map(n => `
          <div class="news-card">
            <div class="news-cat">${n.category}</div>
            <h3>${n.headline}</h3>
            <div class="news-take"><strong>Take:</strong> ${n.hot_take}</div>
          </div>
        `).join('');
      })
      .catch(() => {
        document.getElementById('prod-summary').innerText = "Waiting for data.json to be added next...";
      });
  </script>
</body>
</html>
